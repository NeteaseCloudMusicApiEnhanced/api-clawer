<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#171717">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.json">
  <title>NCM CLAWER · 网易云音乐抓包工具</title>
  <style>
    /* =====================================================================
       UI 框架 · 交接版
       ─ 深色主题（全站固定 dark）· 全站直角 · shadcn 风格 · shell- 动画
       ===================================================================== */

    /* ---------------------- 设计令牌 ---------------------- */
    :root {
      --background: #171717;
      --foreground: #e4e4e4;
      --card: #1f1f1f;
      --card-foreground: #e4e4e4;
      --popover: #242424;
      --popover-foreground: #e4e4e4;
      --primary: #e4e4e4;
      --primary-foreground: #171717;
      --secondary: #a4a4a4;
      --secondary-foreground: #171717;
      --muted: #2e2e2e;
      --muted-foreground: #a1a1a1;
      --accent: #383838;
      --accent-foreground: #e4e4e4;
      --destructive: #ff544c;
      --destructive-foreground: #171717;
      --border: #404040;
      --input: #4d4d4d;
      --ring: #e4e4e4;
      --radius: 0px;          /* 全站直角的核心 */
      --radius-2px: 2px;      /* 唯一微圆角 */
      --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular,
                   "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --topbar-h: 3.5rem;
      --live: #ff2d55;        /* 专属点缀：直播在线 */
      --bili: #fb7299;        /* 专属点缀：B站 */
      /* 列表行列表格模板（可拖拽调宽）：check / method / path / status / crypto / duration / time / del */
      --col-check: 20px;
      --col-method: 54px;
      --col-path: minmax(0, 1fr);
      --col-status: 50px;
      --col-crypto: 62px;
      --col-duration: 58px;
      --col-time: 92px;
      --col-del: 24px;
    }

    /* 灰阶递进：#171717 → #1f1f1f → #242424 → #2e2e2e → #383838
       没有花哨的彩色，全靠层级和边框。 */

    /* ---------------------- Reset ---------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, textarea { font-family: inherit; color: inherit; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }

    :focus-visible {
      outline: 1px solid var(--ring);
      outline-offset: 2px;
    }

    /* 全站微交互统一 75ms，hover 一律前景/背景反转 */
    ::selection { background: var(--foreground); color: var(--background); }

    /* ---------------------- 圆角真相 ----------------------
       --radius: 0px → 所有派生圆角归零，全站直角。
       仅保留两类圆：rounded-full（全圆）、rounded-[2px]（唯一微圆角）。 */
    .rounded-full { border-radius: 9999px; }
    .rounded-2px  { border-radius: var(--radius-2px); }

    /* ---------------------- Button (data-slot="button") ----------------------
       h-9 px-4 · font-mono text-sm · 无圆角 · transition-colors duration-75
       hover 时前景/背景反转 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: background-color 75ms, color 75ms, border-color 75ms;
      user-select: none;
    }
    .btn:active { transform: translateY(0.5px); }
    .btn[disabled] { opacity: 0.45; pointer-events: none; }

    /* 变体：default（实心白） */
    .btn-default { background: var(--primary); color: var(--primary-foreground); }
    .btn-default:hover { background: var(--background); color: var(--foreground); border-color: var(--border); }
    .btn.active { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

    /* 变体：outline（透明 + 边框） */
    .btn-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
    .btn-outline:hover { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

    /* 变体：ghost（透明） */
    .btn-ghost { background: transparent; color: var(--muted-foreground); }
    .btn-ghost:hover { background: var(--foreground); color: var(--background); }

    /* 变体：destructive */
    .btn-destructive { background: transparent; color: var(--destructive); border-color: var(--destructive); }
    .btn-destructive:hover { background: var(--destructive); color: var(--destructive-foreground); }

    /* 变体：icon / icon-xs / icon-sm / icon-lg */
    .btn-icon { width: 36px; height: 36px; padding: 0; flex-shrink: 0; }
    .btn-icon-xs { width: 24px; height: 24px; padding: 0; font-size: 11px; flex-shrink: 0; }
    .btn-icon-sm { width: 30px; height: 30px; padding: 0; font-size: 12px; flex-shrink: 0; }
    .btn-icon-lg { width: 44px; height: 44px; padding: 0; font-size: 15px; flex-shrink: 0; }

    .btn-sm { height: 30px; padding: 0 12px; font-size: 12px; }
    .btn-xs { height: 24px; padding: 0 8px; font-size: 11px; }

    /* ---------------------- Badge ----------------------
       font-mono uppercase text-[10px] px-1.5 py-px */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 18px;
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: var(--radius-2px);
    }
    .badge-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }  /* “新”徽章用 primary 反色 */
    .badge-outline { background: transparent; color: var(--foreground); }
    .badge-muted { background: var(--muted); color: var(--muted-foreground); border-color: transparent; }
    .badge-secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--secondary); }
    .badge-destructive { background: var(--destructive); color: var(--destructive-foreground); border-color: var(--destructive); }

    /* ---------------------- Input ---------------------- */
    .input {
      height: 36px;
      padding: 0 12px;
      background: var(--background);
      border: 1px solid var(--input);
      border-radius: var(--radius);
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 13px;
      transition: border-color 75ms, box-shadow 75ms;
      width: 100%;
    }
    .input:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
    .input::placeholder { color: var(--muted-foreground); }

    .textarea {
      width: 100%;
      background: var(--background);
      border: 1px solid var(--input);
      border-radius: var(--radius);
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: vertical;
      transition: border-color 75ms, box-shadow 75ms;
    }
    .textarea:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }

    /* ---------------------- Checkbox (shadcn 标准，直角) ---------------------- */
    .checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: inline-grid;
      place-content: center;
      background: transparent;
      border: 1px solid var(--input);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 75ms, border-color 75ms, color 75ms;
    }
    .checkbox:checked { background: var(--foreground); border-color: var(--foreground); }
    .checkbox:checked::after {
      content: "\2713";
      font-size: 10px;
      line-height: 1;
      color: var(--background);
      font-weight: 700;
    }
    .checkbox:indeterminate { background: var(--foreground); border-color: var(--foreground); }
    .checkbox:indeterminate::after {
      content: "";
      width: 6px;
      height: 1px;
      background: var(--background);
    }

    .label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 12px; }

    /* ---------------------- Chip（pill 筛选，唯一全圆 + 反色激活） ---------------------- */
    .chip {
      height: 22px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--muted-foreground);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9999px;
      white-space: nowrap;
      transition: background-color 75ms, color 75ms, border-color 75ms;
    }
    .chip:hover { border-color: var(--foreground); color: var(--foreground); }
    .chip.active { background: var(--foreground); border-color: var(--foreground); color: var(--background); }

    /* ---------------------- Card / 卡片网格 ----------------------
       grid gap-px border bg-border —— 用背景色当分隔线，卡片之间零间距 */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .card-grid {
      display: grid;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ---------------------- Skeleton（shell-scan 扫描动画） ---------------------- */
    .skeleton {
      position: relative;
      overflow: hidden;
      background: var(--muted);
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(228, 228, 228, 0.06), transparent);
      animation: shell-scan 1.4s infinite;
    }

    /* ---------------------- Spinner（三方块呼吸） ---------------------- */
    .spinner {
      display: inline-flex;
      align-items: flex-end;
      gap: 4px;
    }
    .spinner-dot {
      width: 6px;
      height: 6px;
      background: var(--foreground);
      animation: shell-spinner-dot 0.9s ease-in-out infinite;
    }
    .spinner-dot:nth-child(2) { animation-delay: 0.3s; }
    .spinner-dot:nth-child(3) { animation-delay: 0.6s; }

    /* ---------------------- 动画系统（shell- 前缀统一） ---------------------- */
    @keyframes shell-blink { 50% { opacity: 0; } }                 /* 闪烁（B站光标） */
    @keyframes shell-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shell-slide-in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shell-slide-in-left { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes shell-slide-in-right { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes shell-slide-in-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shell-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shell-backdrop-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes shell-scan { to { transform: translateX(100%); } }
    @keyframes shell-spinner-dot {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50%      { opacity: 1;   transform: translateY(-3px); }
    }

    .shell-fade-in   { animation: shell-fade-in 150ms ease-out; }
    .shell-slide-in-up    { animation: shell-slide-in-up 180ms ease-out; }
    .shell-slide-in-left  { animation: shell-slide-in-left 180ms ease-out; }
    .shell-slide-in-right { animation: shell-slide-in-right 180ms ease-out; }
    .shell-slide-in-down  { animation: shell-slide-in-down 180ms ease-out; }
    .shell-backdrop-in    { animation: shell-backdrop-in 150ms ease-out; }

    /* 专属点缀：直播在线 #ff2d55（三层扩散光环） */
    .live-dot {
      position: relative;
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: var(--accent);
      transition: background-color 150ms;
    }
    .live-dot.live {
      background: var(--live);
      animation: live-pulse 1.8s ease-out infinite;
    }
    .live-dot.live::before,
    .live-dot.live::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 9999px;
      border: 1px solid var(--live);
      animation: live-ring 1.8s ease-out infinite;
      pointer-events: none;
    }
    .live-dot.live::after { animation-delay: 0.6s; }
    @keyframes live-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.55); }
      70%      { box-shadow: 0 0 0 6px rgba(255, 45, 85, 0); }
    }
    @keyframes live-ring {
      0%   { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* 专属点缀：B站 #fb7299（带闪烁光标） */
    .live-badge {
      color: var(--bili);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .live-badge::after {
      content: "\258D";   /* 右侧半块光标 */
      animation: shell-blink 1s steps(1) infinite;
    }

    /* 尊重 prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* =====================================================================
       布局：顶栏 fixed 毛玻璃 + 主体 max-w-6xl 居中 + 移动端抽屉
       ===================================================================== */

    /* ---------------------- 顶栏 ---------------------- */
    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 40;
      height: var(--topbar-h);
      border-bottom: 1px solid rgba(64, 64, 64, 0.4);
      background: rgba(23, 23, 23, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .topbar-inner {
      height: 100%;
      max-width: 72rem;   /* max-w-6xl */
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: grid;
      place-content: center;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: var(--radius-2px);
    }
    .brand-title { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
    .brand-sub { font-size: 10px; color: var(--muted-foreground); letter-spacing: 0.04em; white-space: nowrap; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .conn { display: flex; align-items: center; gap: 6px; }

    #drawer-open-btn { display: none; }

    /* ---------------------- 主体（全宽，抓包软件式） ---------------------- */
    .main {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: var(--topbar-h) 0 0;
      display: flex;
      flex-direction: column;
    }

    /* ---------------------- 工具栏（一行：搜索 + 筛选 + 操作） ---------------------- */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .toolbar .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--muted-foreground);
      pointer-events: none;
      font-style: normal;
    }
    .search-wrap .input { padding-left: 30px; }
    .btn-group {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      flex-shrink: 0;
    }
    .btn-group .btn { border: none; border-radius: 0; height: 30px; padding: 0 10px; font-size: 12px; }
    .btn-group .btn + .btn { border-left: 1px solid var(--border); }
    .btn-group .btn.active { background: var(--foreground); color: var(--background); }

    .filter-group { display: inline-flex; align-items: center; gap: 4px; }
    .filter-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-foreground);
      margin-right: 1px;
    }
    .f-sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; flex-shrink: 0; }

    /* ---------------------- 底部状态栏（批量操作 + 统计） ---------------------- */
    .statusbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      border-top: 1px solid var(--border);
      background: var(--card);
      font-size: 11px;
      color: var(--muted-foreground);
      min-height: 34px;
    }
    .statusbar strong { color: var(--foreground); font-weight: 700; }
    .sb-stats { margin-left: auto; display: inline-flex; gap: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-stats .sb-block { display: inline-flex; gap: 6px; }
    .sb-stats .sb-block b { color: var(--foreground); font-weight: 700; }

    /* ---------------------- 工作区（类抓包软件：左列表右详情 + 可拖拽分栏） ---------------------- */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      background: var(--background);
      overflow: hidden;
    }

    .list-panel {
      flex: 0 0 40%;
      min-width: 240px;
      max-width: 70%;
      display: flex;
      flex-direction: column;
      background: var(--background);
      border-right: 1px solid var(--border);
    }
    .resize-handle {
      flex-shrink: 0;
      width: 5px;
      cursor: col-resize;
      background: var(--border);
      transition: background-color 75ms;
    }
    .resize-handle:hover,
    .resize-handle.resizing { background: var(--ring); }

    /* 表头行 */
    .list-head {
      display: grid;
      grid-template-columns: var(--col-check) var(--col-method) var(--col-path) var(--col-status) var(--col-crypto) var(--col-duration) var(--col-time) var(--col-del);
      gap: 8px;
      align-items: center;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
      flex-shrink: 0;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-foreground);
      overflow: hidden;
    }
    .list-head .col { position: relative; overflow: visible; white-space: nowrap; }
    /* 列宽拖拽把手：hover 显示分隔线，双击恢复默认 */
    .col-resizer {
      position: absolute; top: 0; bottom: 0; right: 0;
      width: 10px; cursor: col-resize; z-index: 5;
    }
    .col-resizer::after {
      content: '';
      position: absolute; top: 18%; bottom: 18%; right: 5px;
      width: 1px; background: var(--border);
      transition: background-color 75ms;
    }
    .col-resizer:hover::after,
    body.col-resizing .col-resizer::after { background: var(--ring); }
    #drawer-close-btn { display: none; }

    /* 表格行列表：gap-px 分隔线，hover 前景/背景反转 */
    .list-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-auto-rows: min-content;
      gap: 1px;
      background: var(--border);
    }
    .list-card {
      display: grid;
      grid-template-columns: var(--col-check) var(--col-method) var(--col-path) var(--col-status) var(--col-crypto) var(--col-duration) var(--col-time) var(--col-del);
      gap: 8px;
      align-items: center;
      padding: 5px 10px;
      background: var(--card);
      cursor: pointer;
      transition: background-color 75ms, color 75ms;
    }
    .list-card:hover,
    .list-card.active {
      background: var(--foreground);
      color: var(--background);
    }
    .col { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .col-path { font-size: 12px; font-weight: 700; letter-spacing: 0.01em; }
    .col-path .badge { width: auto; margin-right: 4px; }
    .col-time { font-size: 11px; color: var(--muted-foreground); text-align: right; transition: color 75ms; }
    .lc-del { justify-self: end; font-size: 13px; color: var(--muted-foreground); padding: 0; line-height: 1; transition: color 75ms; }
    .lc-del:hover { color: var(--destructive); }
    .list-card .badge { justify-self: start; width: 100%; justify-content: center; }
    /* crypto 徽章点击切换 简写/全称 */
    .crypto-toggle { cursor: pointer; position: relative; }
    .crypto-toggle .badge { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .crypto-toggle:hover::after {
      content: '点击切换名称';
      position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
      background: var(--foreground); color: var(--background);
      font-size: 10px; line-height: 1; padding: 4px 6px; border-radius: var(--radius-2px);
      white-space: nowrap; z-index: 30; pointer-events: none;
    }

    /* 反色状态下子元素微调 */
    .list-card:hover .col-time,
    .list-card.active .col-time { color: rgba(23, 23, 23, 0.55); }
    .list-card:hover .badge,
    .list-card.active .badge { border-color: rgba(23, 23, 23, 0.35); }
    .list-card:hover .badge-outline,
    .list-card.active .badge-outline { color: var(--background); }
    .list-card:hover .badge-muted,
    .list-card.active .badge-muted { background: rgba(23, 23, 23, 0.12); color: var(--background); }
    .list-card:hover .lc-del,
    .list-card.active .lc-del { color: rgba(23, 23, 23, 0.5); }
    .list-card:hover .checkbox,
    .list-card.active .checkbox { border-color: rgba(23, 23, 23, 0.5); }
    .list-card:hover .checkbox:checked,
    .list-card.active .checkbox:checked { background: var(--background); border-color: var(--background); }
    .list-card:hover .checkbox:checked::after,
    .list-card.active .checkbox:checked::after { color: var(--foreground); }

    .detail-panel {
      flex: 1;
      min-width: 0;
      background: var(--card);
      overflow-y: auto;
    }

    /* ---------------------- 空状态 ---------------------- */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 48px 20px;
      color: var(--muted-foreground);
      text-align: center;
    }
    .empty-glyph { font-size: 22px; opacity: 0.4; letter-spacing: 0.1em; }
    .empty-title { font-size: 12px; color: var(--foreground); }
    .empty-hint { font-size: 11px; opacity: 0.7; }

    .empty-fill { min-height: 40vh; }

    /* ---------------------- 详情面板 ---------------------- */
    .detail-card {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .detail-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .dh-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .dh-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      word-break: break-all;
      line-height: 1.4;
    }
    .dh-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; }
    .dh-meta .dim { color: var(--muted-foreground); }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      background: var(--background);
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      font-size: 12px;
      color: var(--muted-foreground);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 75ms, border-color 75ms, background-color 75ms;
    }
    .tab:hover { color: var(--foreground); background: var(--muted); }
    .tab.active { color: var(--foreground); border-bottom-color: var(--foreground); }
    .tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      font-size: 10px;
      background: var(--muted);
      color: var(--muted-foreground);
      border-radius: var(--radius-2px);
      transition: background-color 75ms, color 75ms;
    }
    .tab.active .tab-count { background: var(--foreground); color: var(--background); }

    .tab-content { padding: 14px 16px 16px; }

    .block-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted-foreground);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .block-label strong { color: var(--foreground); font-weight: 700; }

    .code-block {
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--foreground);
    }

    /* Headers 表格 */
    .headers-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .headers-table th, .headers-table td {
      text-align: left;
      padding: 6px 10px;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    .headers-table th {
      color: var(--muted-foreground);
      font-weight: 500;
      background: var(--muted);
      width: 180px;
      min-width: 120px;
      font-size: 11px;
    }
    .headers-table td { word-break: break-all; }
    .headers-table tr:hover td { background: var(--accent); color: var(--accent-foreground); }

    /* ---------------------- Toast ---------------------- */
    .toast-container {
      position: fixed;
      top: calc(var(--topbar-h) + 12px);
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 8px 14px;
      background: var(--popover);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--foreground);
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateX(16px);
      transition: opacity 150ms, transform 150ms;
      pointer-events: auto;
      max-width: 360px;
      animation: shell-slide-in-right 180ms ease-out;
    }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.toast-error { border-color: var(--destructive); color: var(--destructive); }
    .toast.toast-success { border-color: var(--secondary); color: var(--secondary); }

    /* ---------------------- Modal ---------------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; animation: shell-backdrop-in 150ms ease-out; }
    .modal {
      width: min(440px, 100%);
      background: var(--popover);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      transform: scale(0.98);
      transition: transform 150ms;
    }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .modal-message { font-size: 12px; color: var(--muted-foreground); line-height: 1.6; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .modal-wide { width: min(640px, 100%); }

    /* ---------------------- 移动端抽屉 ---------------------- */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms;
    }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; animation: shell-backdrop-in 150ms ease-out; }

    /* ---------------------- 响应式 ---------------------- */
    @media (max-width: 900px) {
      .list-panel { flex-basis: 50%; }
    }

    @media (max-width: 767px) {
      body { overflow: hidden; }
      .brand-sub { display: none; }

      #drawer-open-btn { display: inline-flex; }
      #drawer-close-btn { display: inline-flex; }
      .resize-handle { display: none; }
      .col-resizer { display: none; }

      .workspace { display: block; background: transparent; }

      /* 列表 = 底部抽屉 h-[calc(100dvh-3.5rem)] bg-background/80 + 滑动动画 */
      .list-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 90;
        height: calc(100dvh - var(--topbar-h));
        max-width: none;
        min-width: 0;
        background: rgba(23, 23, 23, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
        border-right: none;
        transform: translateY(100%);
        opacity: 0;
        transition: transform 200ms ease, opacity 200ms ease;
      }
      .list-panel.open { transform: translateY(0); opacity: 1; }
      .list-head { padding: 8px 10px; }

      .detail-panel { min-height: 100%; }

      .detail-actions { gap: 4px; }
      .detail-actions .btn { padding: 0 10px; }

      .toolbar { padding: 8px 10px; }
      .statusbar { padding: 6px 10px; }
    }

    @media (max-width: 480px) {
      .toolbar .search-wrap { min-width: 100%; order: -1; }
      .topbar-actions { gap: 8px; }
      .sb-stats { display: none; }
    }
  </style>
</head>
<body>

  <!-- ======================== 顶栏（fixed 毛玻璃） ======================== -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">NC</div>
        <div>
          <div class="brand-title">NCM CLAWER</div>
          <div class="brand-sub">网易云音乐抓包 · 调试</div>
        </div>
        <span class="badge badge-outline" id="version-badge">v0.0.0</span>
      </div>
      <div class="topbar-actions">
        <div class="conn">
          <span class="live-dot" id="status-dot"></span>
          <span class="live-badge" id="status-label">OFFLINE</span>
        </div>
        <span class="badge badge-primary" id="count-badge">0 REC</span>
        <button class="btn btn-outline btn-sm" id="full-capture-btn" onclick="toggleFullCapture()" title="切换完整抓包模式（捕获全部域名流量）">完整抓包</button>
        <button class="btn btn-outline btn-sm" id="auto-scroll-btn" onclick="toggleAutoScroll()" title="自动滚动到新数据">自动滚动</button>
        <button class="btn btn-outline btn-icon-sm" id="drawer-open-btn" title="抓包列表" aria-label="打开抓包列表">☰</button>
      </div>
    </div>
  </header>

  <!-- ======================== 主体（类抓包软件布局） ======================== -->
  <main class="main">

    <!-- 工具栏：搜索 + 操作 + 筛选，一行紧凑 -->
    <section class="toolbar">
      <div class="search-wrap">
        <i class="search-icon" aria-hidden="true">/</i>
        <input class="input" type="text" id="search-input" placeholder="搜索路径 / 参数 / 头 / 响应..." oninput="onSearchInput()" autocomplete="off" spellcheck="false">
      </div>
      <div class="btn-group" role="group" aria-label="导出格式">
        <button class="btn active" data-fmt="json" onclick="setExportFormat('json')" title="JSON 格式">JSON</button>
        <button class="btn" data-fmt="markdown" onclick="setExportFormat('markdown')" title="Markdown 格式">MD</button>
      </div>
      <button class="btn btn-outline btn-sm" onclick="exportAll()" title="导出所有抓包数据">导出</button>
      <button class="btn btn-outline btn-sm btn-destructive" onclick="confirmClear()" title="清空所有抓包数据">清空</button>

      <div class="f-sep"></div>
      <div class="filter-group">
        <span class="filter-label">方法</span>
        <button class="chip active" data-group="method" data-value="" onclick="setFilter('method', '')">ALL</button>
        <button class="chip" data-group="method" data-value="GET" onclick="setFilter('method', 'GET')">GET</button>
        <button class="chip" data-group="method" data-value="POST" onclick="setFilter('method', 'POST')">POST</button>
        <button class="chip" data-group="method" data-value="PUT" onclick="setFilter('method', 'PUT')">PUT</button>
        <button class="chip" data-group="method" data-value="DELETE" onclick="setFilter('method', 'DELETE')">DEL</button>
      </div>
      <div class="f-sep"></div>
      <div class="filter-group">
        <span class="filter-label">状态</span>
        <button class="chip active" data-group="status" data-value="" onclick="setFilter('status', '')">ALL</button>
        <button class="chip" data-group="status" data-value="2" onclick="setFilter('status', '2')">2xx</button>
        <button class="chip" data-group="status" data-value="3" onclick="setFilter('status', '3')">3xx</button>
        <button class="chip" data-group="status" data-value="4" onclick="setFilter('status', '4')">4xx</button>
        <button class="chip" data-group="status" data-value="5" onclick="setFilter('status', '5')">5xx</button>
      </div>
      <div class="f-sep"></div>
      <div class="filter-group">
        <span class="filter-label">加密</span>
        <button class="chip active" data-group="crypto" data-value="" onclick="setFilter('crypto', '')">ALL</button>
        <button class="chip" data-group="crypto" data-value="eapi" onclick="setFilter('crypto', 'eapi')">EAPI</button>
        <button class="chip" data-group="crypto" data-value="xeapi" onclick="setFilter('crypto', 'xeapi')">XEAPI</button>
        <button class="chip" data-group="crypto" data-value="linuxapi" onclick="setFilter('crypto', 'linuxapi')">LINUX</button>
        <button class="chip" data-group="crypto" data-value="weapi" onclick="setFilter('crypto', 'weapi')">WEAPI</button>
        <button class="chip" data-group="crypto" data-value="api" onclick="setFilter('crypto', 'api')">API</button>
      </div>
      <div class="f-sep"></div>
      <div class="filter-group">
        <span class="filter-label">来源</span>
        <button class="chip active" data-group="netease" data-value="" onclick="setFilter('netease', '')">ALL</button>
        <button class="chip" data-group="netease" data-value="true" onclick="setFilter('netease', 'true')">网易云</button>
      </div>
      <div class="f-sep"></div>
      <div class="filter-group">
        <span class="filter-label">排序</span>
        <button class="chip" data-sort="time" onclick="setSort('time')">时间</button>
        <button class="chip" data-sort="duration" onclick="setSort('duration')">耗时</button>
        <button class="chip" data-sort="path" onclick="setSort('path')">路径</button>
      </div>
    </section>

    <!-- 工作区：左表格列表 + 可拖拽分隔条 + 右详情 -->
    <section class="workspace">
      <div class="list-panel" id="list-panel">
        <div class="list-head">
          <span class="col" style="grid-column:1;"></span>
          <span class="col" data-col="method">METHOD<span class="col-resizer" data-col="method" title="拖拽调整宽度，双击恢复默认"></span></span>
          <span class="col" data-col="path">PATH<span class="col-resizer" data-col="path" title="拖拽调整宽度，双击恢复默认"></span></span>
          <span class="col" data-col="status">STATUS<span class="col-resizer" data-col="status" title="拖拽调整宽度，双击恢复默认"></span></span>
          <span class="col" data-col="crypto">CRYPTO<span class="col-resizer" data-col="crypto" title="拖拽调整宽度，双击恢复默认"></span></span>
          <span class="col" data-col="duration">DURATION<span class="col-resizer" data-col="duration" title="拖拽调整宽度，双击恢复默认"></span></span>
          <span class="col" data-col="time">TIME<span class="col-resizer" data-col="time" title="拖拽调整宽度，双击恢复默认"></span></span>
          <button class="btn btn-ghost btn-icon-xs" id="drawer-close-btn" title="关闭列表" aria-label="关闭列表">×</button>
        </div>
        <div class="list-grid" id="capture-list"></div>
      </div>
      <div class="resize-handle" id="resize-handle" title="拖拽调整列表宽度"></div>
      <div class="detail-panel" id="detail-panel"></div>
    </section>

    <!-- 底部状态栏：批量操作 + 统计 -->
    <section class="statusbar">
      <label class="label">
        <input type="checkbox" class="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this.checked)">
        全选
      </label>
      <span>已选 <strong id="selected-count">0</strong> 条</span>
      <button class="btn btn-xs btn-destructive" onclick="batchDelete()">批量删除</button>
      <button class="btn btn-xs btn-outline" onclick="batchExport()">导出选中</button>
      <span class="sb-stats" id="sb-stats"></span>
    </section>
  </main>

  <!-- ======================== 抽屉遮罩 ======================== -->
  <div class="drawer-backdrop" id="drawer-backdrop" onclick="toggleDrawer(false)"></div>

  <!-- ======================== Toast ======================== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ======================== 确认 Modal ======================== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 class="modal-title" id="modal-title">确认操作</h3>
      <p class="modal-message" id="modal-message">确定要执行此操作吗？</p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
        <button class="btn btn-default" id="modal-confirm-btn">确定</button>
      </div>
    </div>
  </div>

  <!-- ======================== 重放 Modal ======================== -->
  <div class="modal-overlay" id="replay-modal">
    <div class="modal modal-wide">
      <h3 class="modal-title" id="replay-title">重放请求</h3>
      <div class="dh-meta" style="margin-bottom:12px;">
        <span class="badge badge-secondary" id="replay-method">POST</span>
        <span id="replay-path" style="word-break:break-all;"></span>
        <span class="dim" id="replay-crypto"></span>
      </div>
      <div style="margin-bottom:12px;">
        <div class="block-label"><strong>请求参数</strong> 可修改</div>
        <textarea class="textarea" id="replay-params" style="height:200px;" spellcheck="false"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeReplayModal()">取消</button>
        <button class="btn btn-default" id="replay-exec-btn" onclick="executeReplay()">执行重放</button>
      </div>
    </div>
  </div>

  <script>
    // ======================== State ========================
    let capturedData = [];
    let selectedIndex = -1;
    let searchQuery = '';
    var filterMethod = '';
    var filterStatus = '';
    var filterCrypto = '';
    var filterNetease = '';
    let autoScroll = true;
    let eventSource = null;
    let selectedItems = new Set();
    let sortBy = 'time';
    let sortAsc = false;
    let exportFormat = 'json';
    let activeTab = 'params';
    let showRawPath = false;

    // ======================== 工具函数 ========================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function formatJson(obj) {
      try { return JSON.stringify(obj, null, 2); }
      catch (e) { return String(obj); }
    }
    function countKeys(obj) {
      if (!obj || typeof obj !== 'object') return 0;
      return Object.keys(obj).length;
    }
    function formatDuration(ms) {
      if (ms == null) return '';
      if (ms < 1000) return ms + 'ms';
      return (ms / 1000).toFixed(2) + 's';
    }
    function formatTime(timestamp) {
      try { return new Date(timestamp).toLocaleTimeString('zh-CN', { hour12: false }); }
      catch (e) { return timestamp; }
    }
    function formatFullDate(timestamp) {
      try { return new Date(timestamp).toLocaleString('zh-CN', { hour12: false }); }
      catch (e) { return timestamp; }
    }
    function filterParam(param) {
      if (!param || typeof param !== 'object') return param;
      const filtered = {};
      for (const key in param) {
        if (key !== 'e_r' && key !== 'header') filtered[key] = param[key];
      }
      return filtered;
    }

    // ======================== Toast ========================
    function showToast(message, type) {
      type = type || 'info';
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 200);
      }, 2200);
    }

    // ======================== Modal ========================
    function showConfirm(title, message, onConfirm) {
      const overlay = document.getElementById('modal-overlay');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      const confirmBtn = document.getElementById('modal-confirm-btn');
      const newBtn = confirmBtn.cloneNode(true);
      confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
      newBtn.addEventListener('click', () => { closeModal(); if (onConfirm) onConfirm(); });
      overlay.classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
    }
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });
    document.getElementById('replay-modal').addEventListener('click', (e) => {
      if (e.target.id === 'replay-modal') closeReplayModal();
    });

    // ======================== 移动端抽屉 ========================
    function toggleDrawer(force) {
      const panel = document.getElementById('list-panel');
      const backdrop = document.getElementById('drawer-backdrop');
      const isOpen = force !== undefined ? force : !panel.classList.contains('open');
      panel.classList.toggle('open', isOpen);
      backdrop.classList.toggle('show', isOpen);
    }
    function isMobile() {
      return window.matchMedia('(max-width: 767px)').matches;
    }
    window.addEventListener('resize', () => {
      if (!isMobile()) toggleDrawer(false);
    });

    // ======================== 搜索 / 筛选 ========================
    function onSearchInput() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderCaptureList();
    }

    function matchesFilters(item) {
      if (searchQuery) {
        const q = searchQuery;
        if ((item.path || '').toLowerCase().includes(q)) return true;
        if ((item.hostname || '').toLowerCase().includes(q)) return true;
        if ((item.rawPath || '').toLowerCase().includes(q)) return true;
        if ((item.crypto || '').toLowerCase().includes(q)) return true;
        if ((item.method || '').toLowerCase().includes(q)) return true;
        if (String(item.statusCode || '').includes(q)) return true;
        if ((item.error || '').toLowerCase().includes(q)) return true;
        const objFields = ['param', 'response', 'requestHeaders', 'responseHeaders'];
        for (const key of objFields) {
          const val = item[key];
          if (val && typeof val === 'object') {
            try { if (JSON.stringify(val).toLowerCase().includes(q)) return true; } catch (_) {}
          }
        }
        if (item.responseBody && item.responseBody.toLowerCase().includes(q)) return true;
        return false;
      }
      return true;
    }
    function matchesFiltersStrict(item) {
      if (filterMethod && (item.method || '').toUpperCase() !== filterMethod) return false;
      if (filterStatus) {
        const codeGroup = String(item.statusCode || '')[0];
        if (codeGroup !== filterStatus) return false;
      }
      if (filterCrypto && (item.crypto || '') !== filterCrypto) return false;
      if (filterNetease === 'true' && !item.isNetease) return false;
      return true;
    }

    function setFilter(group, value) {
      const key = 'filter' + group.charAt(0).toUpperCase() + group.slice(1);
      if (window[key] === value) return;
      window[key] = value;
      document.querySelectorAll('.filter-group .chip[data-group="' + group + '"]').forEach(el => {
        el.classList.toggle('active', el.dataset.value === value);
      });
      renderCaptureList();
    }

    function setExportFormat(fmt) {
      exportFormat = fmt;
      document.querySelectorAll('.btn-group .btn[data-fmt]').forEach(el => {
        el.classList.toggle('active', el.dataset.fmt === fmt);
      });
    }

    function toggleFullCapture() {
      const btn = document.getElementById('full-capture-btn');
      const newState = !btn.classList.contains('active');
      fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullCapture: newState }),
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          btn.classList.toggle('active', data.fullCapture);
          btn.textContent = data.fullCapture ? '完整抓包 ON' : '完整抓包';
          btn.classList.toggle('btn-default', data.fullCapture);
          showToast(data.fullCapture ? '完整抓包已开启，捕获全部域名' : '已切换为普通模式', 'info');
        }
      })
      .catch(e => showToast('设置失败: ' + e.message, 'error'));
    }

    function toggleAutoScroll() {
      autoScroll = !autoScroll;
      const btn = document.getElementById('auto-scroll-btn');
      btn.classList.toggle('active', autoScroll);
      btn.classList.toggle('btn-default', autoScroll);
      btn.textContent = autoScroll ? '自动滚动' : '手动';
    }

    // ======================== 排序 ========================
    function setSort(field) {
      if (sortBy === field) {
        sortAsc = !sortAsc;
      } else {
        sortBy = field;
        sortAsc = false;
      }
      document.querySelectorAll('.filters .chip[data-sort]').forEach(el => {
        const isActive = el.dataset.sort === sortBy;
        el.classList.toggle('active', isActive);
        if (isActive) {
          el.textContent = { time: '时间', duration: '耗时', path: '路径' }[sortBy] + (sortAsc ? ' ↑' : ' ↓');
        } else {
          el.textContent = { time: '时间', duration: '耗时', path: '路径' }[el.dataset.sort];
        }
      });
      renderCaptureList();
    }

    function getSortedData(data) {
      const arr = [...data];
      arr.sort((a, b) => {
        let cmp = 0;
        switch (sortBy) {
          case 'time': cmp = (a.timestamp || '').localeCompare(b.timestamp || ''); break;
          case 'duration': cmp = (a.duration || 0) - (b.duration || 0); break;
          case 'path': cmp = (a.path || '').localeCompare(b.path || ''); break;
        }
        return sortAsc ? cmp : -cmp;
      });
      return arr;
    }

    // ======================== 批量操作 ========================
    function toggleSelectAll(checked) {
      const filtered = capturedData.filter(item => matchesFilters(item) && matchesFiltersStrict(item));
      filtered.forEach(item => {
        const idx = capturedData.indexOf(item);
        if (checked) selectedItems.add(idx);
        else selectedItems.delete(idx);
      });
      updateBatchUI();
      renderCaptureList();
    }
    function toggleItemSelection(index) {
      if (selectedItems.has(index)) selectedItems.delete(index);
      else selectedItems.add(index);
      updateBatchUI();
      renderCaptureList();
    }
    function updateBatchUI() {
      const count = selectedItems.size;
      document.getElementById('selected-count').textContent = count;
      const allCheck = document.getElementById('select-all-checkbox');
      if (allCheck) {
        const filtered = capturedData.filter(item => matchesFilters(item) && matchesFiltersStrict(item));
        allCheck.checked = filtered.length > 0 && filtered.every(item => selectedItems.has(capturedData.indexOf(item)));
        allCheck.indeterminate = count > 0 && !allCheck.checked;
      }
    }
    function batchDelete() {
      if (selectedItems.size === 0) return showToast('请先选择要删除的记录', 'info');
      showConfirm('批量删除', '确定要删除选中的 ' + selectedItems.size + ' 条记录吗？', () => {
        const sorted = [...selectedItems].sort((a, b) => b - a);
        sorted.forEach(idx => capturedData.splice(idx, 1));
        selectedItems.clear();
        if (selectedIndex >= capturedData.length) selectedIndex = -1;
        renderCaptureList();
        updateBatchUI();
        if (selectedIndex === -1) renderEmptyDetail();
        showToast('已删除 ' + sorted.length + ' 条记录', 'info');
      });
    }
    function batchExport() {
      if (selectedItems.size === 0) return showToast('请先选择要导出的记录', 'info');
      const selected = [...selectedItems].sort((a, b) => a - b).map(idx => capturedData[idx]).filter(Boolean);
      downloadExport(selected, 'netease-selected');
      showToast('已导出 ' + selected.length + ' 条记录', 'success');
    }

    // ======================== 徽章助手 ========================
    function getMethodBadge(method) {
      method = (method || '').toUpperCase();
      return '<span class="badge badge-muted">' + escapeHtml(method || '---') + '</span>';
    }
    function getStatusBadge(code) {
      if (!code) return '<span class="badge badge-destructive">ERR</span>';
      const group = Math.floor(code / 100);
      const cls = (group === 4 || group === 5) ? 'badge-destructive' : 'badge-outline';
      return '<span class="badge ' + cls + '">' + code + '</span>';
    }
    function getCryptoLabel(crypto) {
      const names = { eapi: 'EAPI', xeapi: 'XEAPI', linuxapi: 'LINUX', weapi: 'WEAPI', api: 'API' };
      const label = names[crypto] || (crypto ? crypto.toUpperCase() : '');
      return label ? '<span class="badge badge-outline">' + label + '</span>' : '';
    }
    function getCryptoName(crypto) {
      const names = {
        eapi: 'EAPI (AES-128-ECB)', xeapi: 'XEAPI (AES-128-ECB)',
        linuxapi: 'LinuxAPI (AES-128-ECB)', weapi: 'WEAPI (RSA + AES)', api: 'API (未加密)',
      };
      return names[crypto] || crypto || '未知';
    }
    function toggleCryptoDisplay(index, el) {
      const item = capturedData[index];
      if (!item || !el) return;
      el.dataset.expanded = el.dataset.expanded === '1' ? '0' : '1';
      const expanded = el.dataset.expanded === '1';
      el.innerHTML = expanded ? '<span class="badge badge-outline">' + getCryptoName(item.crypto) + '</span>'
                              : getCryptoLabel(item.crypto);
      el.title = expanded ? '点击切换简写' : '点击切换完整名称';
    }
    function isNeteaseBadge(item) {
      if (item.isNetease) return '<span class="badge badge-secondary">网易云</span>';
      return '<span class="badge badge-muted">通用</span>';
    }

    // ======================== 渲染列表 ========================
    function renderCaptureList() {
      const container = document.getElementById('capture-list');

      const filtered = capturedData.filter(item => matchesFilters(item) && matchesFiltersStrict(item));
      const sorted = getSortedData(filtered);

      updateCountBadge();
      updateBatchUI();

      if (sorted.length === 0) {
        const filteredEmpty = searchQuery || filterMethod || filterStatus || filterCrypto || filterNetease;
        container.innerHTML = `
          <div class="empty" style="grid-column:1/-1;">
            <div class="empty-glyph">[ ${filteredEmpty ? 'FILTER' : '--' } ]</div>
            <div class="empty-title">${filteredEmpty ? '没有匹配的抓包记录' : '暂无抓包数据'}</div>
            <div class="empty-hint">${filteredEmpty ? '试试调整筛选条件' : '设置代理后开始抓包'}</div>
          </div>`;
        return;
      }

      container.innerHTML = sorted.map((item) => {
        const realIdx = capturedData.indexOf(item);
        const isActive = realIdx === selectedIndex;
        const isChecked = selectedItems.has(realIdx);
        const cryptoLabel = item.crypto
          ? `<span class="crypto-toggle" onclick="event.stopPropagation();toggleCryptoDisplay(${realIdx}, this)" title="点击切换完整名称">${getCryptoLabel(item.crypto)}</span>`
          : '';
        const methodBadge = getMethodBadge(item.method);
        const statusBadge = getStatusBadge(item.statusCode);
        const time = formatTime(item.timestamp);
        const durText = item.duration != null ? formatDuration(item.duration) : '';
        const durCls = item.duration > 3000 ? 'badge-destructive' : (item.duration > 1000 ? 'badge-secondary' : 'badge-outline');
        const replayMark = item.replay ? '<span class="badge badge-primary" title="重放" style="width:auto;padding:0 4px;font-size:9px;">R</span>' : '';

        const displayPath = item.isNetease
          ? (item.path || 'Unknown')
          : (item.hostname ? item.hostname + (item.path ? item.path.replace(/^https?:\/\/[^/]+/, '') : '') : (item.path || 'Unknown'));

        return `
          <div class="list-card ${isActive ? 'active' : ''}"
               data-index="${realIdx}"
               onclick="selectCapture(${realIdx})">
            <input type="checkbox" class="checkbox" ${isChecked ? 'checked' : ''}
                   onclick="event.stopPropagation();toggleItemSelection(${realIdx})"
                   aria-label="选择记录">
            ${methodBadge}
            <span class="col col-path" title="${escapeHtml(displayPath)}">${replayMark}${escapeHtml(displayPath)}</span>
            ${statusBadge}
            ${cryptoLabel}
            <span class="badge ${durCls}" title="耗时">${durText}</span>
            <span class="col col-time">${time}</span>
            <button class="lc-del" onclick="event.stopPropagation();deleteItem(${realIdx})" title="删除">×</button>
          </div>`;
      }).join('');
    }

    // ======================== 空详情 ========================
    function renderEmptyDetail() {
      document.getElementById('detail-panel').innerHTML = `
        <div class="empty empty-fill">
          <div class="empty-glyph">[ -- ]</div>
          <div class="empty-title">选择一个抓包记录查看详情</div>
          <div class="empty-hint">点击左侧列表任意记录</div>
        </div>`;
    }

    // ======================== 选择 & 详情 ========================
    function getDisplayPath(item) {
      if (showRawPath && item && item.rawPath) return item.rawPath;
      return item ? item.path : '';
    }
    function getRawPrefix(rawPath) {
      if (!rawPath) return '/api/';
      const match = rawPath.match(/^(\/[a-z0-9_]+)(\/|$)/);
      return match ? match[1] + '/' : '/api/';
    }

    function selectCapture(index, instant) {
      selectedIndex = index;
      const item = capturedData[index];
      activeTab = 'params';
      showRawPath = false;

      if (!item) {
        renderEmptyDetail();
        renderCaptureList();
        return;
      }

      renderDetail(item, index);
      renderCaptureList();
      if (isMobile()) toggleDrawer(false);

      setTimeout(() => {
        const el = document.querySelector('.list-card[data-index="' + index + '"]');
        if (el) el.scrollIntoView({ block: 'nearest', behavior: instant ? 'auto' : 'smooth' });
      }, 50);
    }

    function renderDetail(item, index) {
      const panel = document.getElementById('detail-panel');
      const cryptoLabel = getCryptoLabel(item.crypto);
      const cryptoName = item.crypto ? getCryptoName(item.crypto) : '';
      const methodBadge = getMethodBadge(item.method);
      const statusBadge = getStatusBadge(item.statusCode);
      const fullDate = formatFullDate(item.timestamp);
      const durText = item.duration != null ? formatDuration(item.duration) : '';
      const durCls = item.duration > 3000 ? 'badge-destructive' : (item.duration > 1000 ? 'badge-secondary' : 'badge-outline');
      const neteaseBadge = isNeteaseBadge(item);

      const filteredParam = filterParam(item.param);
      const reqHeaders = item.requestHeaders || {};
      const resHeaders = item.responseHeaders || {};
      const reqHCount = countKeys(reqHeaders);
      const resHCount = countKeys(resHeaders);

      const detailPath = item.isNetease ? (getDisplayPath(item) || 'Unknown') : (item.path || 'Unknown');
      const detailHost = item.isNetease ? '' : (item.hostname ? escapeHtml(item.hostname) : '');
      const rawPathToggle = item.rawPath
        ? `<button class="btn btn-outline btn-xs" onclick="event.stopPropagation();togglePathDisplay(${index})" title="切换路径显示">
             ${showRawPath ? '/api/' : escapeHtml(getRawPrefix(item.rawPath))}
           </button>`
        : '';

      panel.innerHTML = `
        <article class="detail-card">
          <header class="detail-header">
            <div class="dh-top">
              ${methodBadge}
              <h2 class="dh-title">${escapeHtml(detailPath)}</h2>
              ${rawPathToggle}
            </div>
            <div class="dh-meta">
              ${statusBadge}
              ${cryptoLabel}
              ${neteaseBadge}
              <span class="badge ${durCls}">${durText}</span>
              <span class="dim">${cryptoName}</span>
              <span class="dim">${fullDate}</span>
              ${detailHost ? `<span class="dim">${detailHost}</span>` : ''}
            </div>
          </header>

          <div class="detail-actions">
            <button class="btn btn-outline btn-sm" onclick="copyPath(${index})">复制路径</button>
            <button class="btn btn-outline btn-sm" onclick="copyCurl(${index})">复制 cURL</button>
            ${item.param ? `<button class="btn btn-outline btn-sm" onclick="copyParam(${index})">复制参数</button>` : ''}
            <button class="btn btn-outline btn-sm" onclick="copyResponse(${index})">复制响应</button>
            <button class="btn btn-outline btn-sm" onclick="copyHeaders(${index}, 'req')">请求头</button>
            <button class="btn btn-outline btn-sm" onclick="copyHeaders(${index}, 'res')">响应头</button>
            ${item.isNetease ? `<button class="btn btn-default btn-sm" onclick="replayCapture(${index})">重放</button>` : ''}
          </div>

          <nav class="tabs" aria-label="详情标签">
            ${item.param ? `<button class="tab ${activeTab === 'params' ? 'active' : ''}" onclick="switchTab('params')">
              请求参数 <span class="tab-count">${countKeys(filteredParam)}</span>
            </button>` : ''}
            <button class="tab ${activeTab === 'reqHeaders' ? 'active' : ''}" onclick="switchTab('reqHeaders')">
              请求头 <span class="tab-count">${reqHCount}</span>
            </button>
            <button class="tab ${activeTab === 'resHeaders' ? 'active' : ''}" onclick="switchTab('resHeaders')">
              响应头 <span class="tab-count">${resHCount}</span>
            </button>
            <button class="tab ${activeTab === 'response' ? 'active' : ''}" onclick="switchTab('response')">
              响应数据 <span class="tab-count">${item.response ? countKeys(item.response) : (item.responseBody ? '1' : 0)}</span>
            </button>
            <button class="tab ${activeTab === 'raw' ? 'active' : ''}" onclick="switchTab('raw')">
              原始 JSON
            </button>
          </nav>

          <div class="tab-content" id="detail-tab-content">
            ${renderTabContent(item, filteredParam)}
          </div>
        </article>`;
    }

    function renderHeadersTable(headers) {
      if (!headers || countKeys(headers) === 0) {
        return '<div class="empty" style="padding:24px;"><div class="empty-hint">暂无数据</div></div>';
      }
      const rows = Object.entries(headers).map(([key, value]) => {
        const displayValue = Array.isArray(value) ? value.join(', ') : String(value);
        return '<tr><th>' + escapeHtml(key) + '</th><td>' + escapeHtml(displayValue) + '</td></tr>';
      }).join('');
      return '<table class="headers-table"><tbody>' + rows + '</tbody></table>';
    }

    function renderTabContent(item, filteredParam) {
      switch (activeTab) {
        case 'params':
          return `
            <div class="block-label"><strong>请求参数</strong> ${countKeys(filteredParam)} 个字段</div>
            <pre class="code-block">${formatJson(filteredParam)}</pre>`;
        case 'reqHeaders':
          return `
            <div class="block-label"><strong>请求 Headers</strong> ${countKeys(item.requestHeaders)} 个</div>
            ${renderHeadersTable(item.requestHeaders)}`;
        case 'resHeaders':
          return `
            <div class="block-label"><strong>响应 Headers</strong> ${countKeys(item.responseHeaders)} 个</div>
            ${renderHeadersTable(item.responseHeaders)}`;
        case 'response':
          if (!item.response && !item.responseBody) {
            return `
              <div class="empty" style="padding:32px;">
                <div class="empty-glyph">[ 空 ]</div>
                <div class="empty-title">暂无响应数据</div>
                ${item.error ? '<div class="empty-hint" style="color:var(--destructive);">错误: ' + escapeHtml(item.error) + '</div>' : ''}
              </div>`;
          }
          if (item.response) {
            return `
              <div class="block-label">
                <strong>响应数据</strong> ${countKeys(item.response)} 个字段
                <label class="label" style="text-transform:none;letter-spacing:0;">
                  <input type="checkbox" class="checkbox" id="toggle-raw" onchange="toggleResponseRaw(${capturedData.indexOf(item)})">
                  原始格式
                </label>
              </div>
              <pre class="code-block" id="response-content">${formatJson(item.response)}</pre>`;
          }
          if (item.responseBody) {
            return `
              <div class="block-label"><strong>响应体</strong> 文本</div>
              <pre class="code-block">${escapeHtml(item.responseBody)}</pre>`;
          }
          return '';
        case 'raw':
          return `
            <div class="block-label">
              <strong>完整原始数据</strong>
              <button class="btn btn-outline btn-xs" onclick="copyRaw(${capturedData.indexOf(item)})">复制</button>
            </div>
            <pre class="code-block">${formatJson(item)}</pre>`;
        default:
          return '';
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      const item = capturedData[selectedIndex];
      if (item) renderDetail(item, selectedIndex);
    }
    function togglePathDisplay(index) {
      showRawPath = !showRawPath;
      const item = capturedData[index];
      if (item) renderDetail(item, index);
    }
    function toggleResponseRaw(index) {
      const item = capturedData[index];
      if (!item || !item.response) return;
      const el = document.getElementById('response-content');
      if (!el) return;
      el.textContent = document.getElementById('toggle-raw').checked ? JSON.stringify(item.response) : formatJson(item.response);
    }

    // ======================== 复制 ========================
    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(label || '已复制', 'success');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(label || '已复制', 'success');
        } catch (e) {
          showToast('复制失败，请手动复制', 'error');
        }
        document.body.removeChild(ta);
      });
    }
    function copyPath(index) {
      const item = capturedData[index];
      if (!item) return showToast('无数据', 'error');
      const path = item.isNetease ? getDisplayPath(item) : (item.path || '');
      if (!path) return showToast('无路径可复制', 'error');
      copyToClipboard(path, '路径已复制');
    }
    function copyParam(index) {
      const item = capturedData[index];
      if (!item) return;
      copyToClipboard(formatJson(filterParam(item.param)), '参数已复制');
    }
    function copyResponse(index) {
      const item = capturedData[index];
      if (!item || !item.response) return showToast('无响应数据可复制', 'error');
      copyToClipboard(formatJson(item.response), '响应已复制');
    }
    function copyRaw(index) {
      const item = capturedData[index];
      if (!item) return;
      copyToClipboard(formatJson(item), '原始数据已复制');
    }
    function copyHeaders(index, type) {
      const item = capturedData[index];
      if (!item) return;
      const headers = type === 'req' ? item.requestHeaders : item.responseHeaders;
      if (!headers || countKeys(headers) === 0) return showToast('无头部数据可复制', 'error');
      const text = Object.entries(headers)
        .map(([k, v]) => k + ': ' + (Array.isArray(v) ? v.join(', ') : v))
        .join('\n');
      copyToClipboard(text, (type === 'req' ? '请求头' : '响应头') + '已复制');
    }
    function copyCurl(index) {
      const item = capturedData[index];
      if (!item) return showToast('数据不完整', 'error');
      const method = (item.method || 'POST').toUpperCase();
      let url = item.isNetease ? ('https://music.163.com' + (getDisplayPath(item) || '')) : (item.path || '');
      let curl = "curl -X " + method + " '" + url + "'";
      if (item.requestHeaders) {
        Object.entries(item.requestHeaders).forEach(([k, v]) => {
          if (['host', 'content-length', 'proxy-connection'].includes(k.toLowerCase())) return;
          curl += " \\\n  -H '" + k + ': ' + (Array.isArray(v) ? v.join(', ') : v).replace(/'/g, "'\\''") + "'";
        });
      }
      if (item.param) {
        const filtered = filterParam(item.param);
        if (Object.keys(filtered).length > 0) {
          const jsonData = JSON.stringify(filtered);
          curl += " \\\n  -d '" + jsonData.replace(/'/g, "'\\''") + "'";
        }
      }
      copyToClipboard(curl, 'cURL 已复制');
    }

    // ======================== 删除 / 清空 ========================
    function deleteItem(index) {
      const item = capturedData[index];
      if (!item) return;
      const path = item.path || 'Unknown';
      showConfirm('删除抓包记录', '确定要删除 "' + path + '" 的抓包记录吗？', () => {
        capturedData.splice(index, 1);
        if (selectedIndex === index) {
          selectedIndex = -1;
          renderEmptyDetail();
        } else if (selectedIndex > index) {
          selectedIndex--;
        }
        renderCaptureList();
        showToast('已删除该记录', 'info');
      });
    }
    function confirmClear() {
      if (!capturedData || capturedData.length === 0) return showToast('暂无数据可清空', 'info');
      showConfirm('清空所有数据', '确定要清空全部 ' + capturedData.length + ' 条抓包记录吗？此操作不可撤销。', () => {
        capturedData = [];
        selectedIndex = -1;
        selectedItems.clear();
        renderCaptureList();
        renderEmptyDetail();
        fetch('/api/clear', { method: 'POST' })
          .then(r => r.json())
          .then(d => { if (d.success) showToast('已清空所有数据', 'info'); })
          .catch(() => showToast('清空请求失败', 'error'));
      });
    }

    // ======================== 重放 ========================
    let replayFormData = {};
    let replayIndex = -1;

    function replayCapture(index) {
      const item = capturedData[index];
      if (!item) return showToast('数据不完整', 'error');
      replayIndex = index;
      replayFormData = JSON.parse(JSON.stringify(item.param || {}));
      showReplayModal(item);
    }
    function showReplayModal(item) {
      const overlay = document.getElementById('replay-modal');
      document.getElementById('replay-title').textContent = '重放请求: ' + (item.path || 'Unknown');
      document.getElementById('replay-path').textContent = item.path || '';
      document.getElementById('replay-method').textContent = item.method || 'POST';
      document.getElementById('replay-crypto').textContent = getCryptoName(item.crypto);
      document.getElementById('replay-params').value = formatJson(replayFormData);
      overlay.classList.add('show');
    }
    function closeReplayModal() {
      document.getElementById('replay-modal').classList.remove('show');
    }
    function executeReplay() {
      const item = capturedData[replayIndex];
      if (!item) return;
      try {
        replayFormData = JSON.parse(document.getElementById('replay-params').value);
      } catch (e) {
        showToast('参数格式错误，请检查 JSON', 'error');
        return;
      }
      const btn = document.getElementById('replay-exec-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"><span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span></span> 重放中';

      fetch('/api/replay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          path: item.path,
          method: item.method,
          params: replayFormData,
          crypto: item.crypto,
          rawPath: item.rawPath,
          requestHeaders: item.requestHeaders,
        })
      })
      .then(r => r.json())
      .then(result => {
        closeReplayModal();
        if (result.error) {
          showToast('重放失败: ' + result.error, 'error');
        } else {
          showToast('重放成功，已添加到列表', 'success');
          if (capturedData.length > 0) selectCapture(capturedData.length - 1);
        }
      })
      .catch(e => showToast('重放请求失败: ' + e.message, 'error'))
      .finally(() => {
        btn.disabled = false;
        btn.textContent = '执行重放';
      });
    }

    // ======================== 导出 ========================
    function renderMarkdownExport(items) {
      const escapeMd = (s) => String(s).replace(/\|/g, '\\|');
      const parts = items.map((item, i) => {
        const lines = [];
        const method = item.method || 'GET';
        const path = item.path || '/';
        lines.push('# ' + (i + 1) + '. ' + method + ' `' + path + '`');
        lines.push('');
        const meta = [];
        if (item.statusCode) meta.push('**状态:** ' + item.statusCode);
        if (item.duration != null) meta.push('**耗时:** ' + item.duration + 'ms');
        if (item.crypto) meta.push('**加密:** ' + item.crypto);
        if (item.hostname) meta.push('**域名:** ' + item.hostname);
        if (item.isNetease) meta.push('**来源:** 网易云');
        if (item.error) meta.push('**错误:** ' + item.error);
        lines.push('> ' + meta.join(' | '));
        lines.push('');
        if (item.requestHeaders && Object.keys(item.requestHeaders).length > 0) {
          lines.push('## 请求头'); lines.push('');
          lines.push('| 名称 | 值 |'); lines.push('|------|-----|');
          for (const [k, v] of Object.entries(item.requestHeaders)) {
            const val = Array.isArray(v) ? v.join(', ') : String(v);
            lines.push('| ' + escapeMd(k) + ' | ' + escapeMd(val) + ' |');
          }
          lines.push('');
        }
        if (item.param && Object.keys(item.param).length > 0) {
          lines.push('## 请求参数'); lines.push('');
          lines.push('```json'); lines.push(formatJson(item.param)); lines.push('```'); lines.push('');
        }
        if (item.responseHeaders && Object.keys(item.responseHeaders).length > 0) {
          lines.push('## 响应头'); lines.push('');
          lines.push('| 名称 | 值 |'); lines.push('|------|-----|');
          for (const [k, v] of Object.entries(item.responseHeaders)) {
            const val = Array.isArray(v) ? v.join(', ') : String(v);
            lines.push('| ' + escapeMd(k) + ' | ' + escapeMd(val) + ' |');
          }
          lines.push('');
        }
        if (item.response && Object.keys(item.response).length > 0) {
          lines.push('## 响应体'); lines.push('');
          lines.push('```json'); lines.push(formatJson(item.response)); lines.push('```'); lines.push('');
        } else if (item.responseBody) {
          lines.push('## 响应体（文本）'); lines.push('');
          lines.push('```'); lines.push(item.responseBody); lines.push('```'); lines.push('');
        }
        if (i < items.length - 1) { lines.push('---'); lines.push(''); }
        return lines.join('\n');
      });
      return parts.join('\n');
    }
    function downloadExport(items, prefix) {
      if (!items || items.length === 0) return showToast('暂无数据可导出', 'info');
      const isMd = exportFormat === 'markdown';
      const ext = isMd ? 'md' : 'json';
      const content = isMd ? renderMarkdownExport(items) : formatJson(items);
      const type = isMd ? 'text/markdown' : 'application/json';
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = prefix + '-' + new Date().toISOString().slice(0, 19).replace(/[:-]/g, '') + '.' + ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function exportAll() {
      if (!capturedData || capturedData.length === 0) return showToast('暂无数据可导出', 'info');
      downloadExport(capturedData, 'netease-capture');
      showToast('已导出 ' + capturedData.length + ' 条记录', 'success');
    }

    // ======================== 顶栏状态 ========================
    function setConnUI(connected) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      dot.classList.toggle('live', connected);
      label.textContent = connected ? 'LIVE' : 'OFFLINE';
    }
    function updateCountBadge() {
      const el = document.getElementById('count-badge');
      if (el) el.textContent = capturedData.length + ' REC';
    }

    // ======================== 状态栏统计 ========================
    function renderStats(stats) {
      const el = document.getElementById('sb-stats');
      if (!el) return;
      const methods = Object.entries(stats.methods || {}).sort((a, b) => b[1] - a[1]);
      const cryptos = Object.entries(stats.cryptos || {}).sort((a, b) => b[1] - a[1]);
      const status = Object.entries(stats.statusGroups || {}).sort((a, b) => b[1] - a[1]);
      const block = (label, arr) => {
        if (!arr.length) return '';
        return '<span class="sb-block">' + label + ' <b>' + arr.slice(0, 3).map(([k, v]) => k + '=' + v).join(' · ') + '</b></span>';
      };
      el.innerHTML = block('M', methods) + block('E', cryptos) + block('S', status);
    }
    function fetchStats() {
      fetch('/api/stats')
        .then(r => r.json())
        .then(stats => { if (stats && typeof stats.total === 'number') renderStats(stats); })
        .catch(() => {});
    }

    // ======================== 面板拖拽（恢复源布局分栏） ========================
    function initResize() {
      const handle = document.getElementById('resize-handle');
      const panel = document.getElementById('list-panel');
      if (!handle || !panel) return;
      let isResizing = false;

      handle.addEventListener('mousedown', (e) => {
        isResizing = true;
        handle.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const maxWidth = window.innerWidth * 0.65;
        const minWidth = 240;
        const width = Math.max(minWidth, Math.min(maxWidth, e.clientX));
        panel.style.flexBasis = width + 'px';
        panel.style.maxWidth = 'none';
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          handle.classList.remove('resizing');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    }

    // ======================== 列宽拖拽（表头分隔线） ========================
    let resizeCol = null, resizeStartX = 0, resizeStartW = 0;

    function initColumnResize() {
      restoreColWidths();
      document.addEventListener('mousedown', (e) => {
        const resizer = e.target.closest('.col-resizer');
        if (!resizer || !resizer.dataset.col || isMobile()) return;
        resizeCol = resizer.dataset.col;
        resizeStartX = e.clientX;
        resizeStartW = getRenderedColWidth(resizeCol);
        document.body.classList.add('col-resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
      document.addEventListener('mousemove', (e) => {
        if (!resizeCol) return;
        const idx = { method: 1, path: 2, status: 3, crypto: 4, duration: 5, time: 6 }[resizeCol];
        let w = Math.round(resizeStartW + (e.clientX - resizeStartX));
        const panel = document.getElementById('list-panel');
        const head = panel && panel.querySelector('.list-head');
        if (panel && head && idx != null) {
          // 上限 = 面板宽度 - 其他列当前渲染宽 - 列间距，防止溢出到右侧详情区
          const rendered = getComputedStyle(head).gridTemplateColumns.split(' ').map(s => parseFloat(s) || 0);
          const others = rendered.reduce((sum, c, i) => (i === idx ? sum : sum + c), 0);
          const maxW = Math.max(28, Math.floor(panel.clientWidth - others - 8 * 7 - 20));
          w = Math.min(w, maxW);
        }
        setColWidth(resizeCol, Math.max(28, w));
      });
      document.addEventListener('mouseup', () => {
        if (!resizeCol) return;
        resizeCol = null;
        document.body.classList.remove('col-resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });
      // 双击把手恢复默认宽度
      document.addEventListener('dblclick', (e) => {
        const resizer = e.target.closest('.col-resizer');
        if (resizer && resizer.dataset.col) resetColWidth(resizer.dataset.col);
      });
    }

    function getRenderedColWidth(col) {
      const idx = { method: 1, path: 2, status: 3, crypto: 4, duration: 5, time: 6 }[col];
      if (idx == null) return 0;
      const head = document.querySelector('.list-head');
      if (!head) return 0;
      const w = parseFloat(getComputedStyle(head).gridTemplateColumns.split(' ')[idx]);
      return isNaN(w) ? 0 : w;
    }

    function setColWidth(col, w) {
      const root = document.documentElement;
      if (col === 'path') {
        root.style.setProperty('--col-path', 'minmax(' + w + 'px, 1fr)');
      } else {
        root.style.setProperty('--col-' + col, w + 'px');
      }
      localStorage.setItem('ncm-col-' + col, String(w));
    }

    function resetColWidth(col) {
      document.documentElement.style.removeProperty('--col-' + col);
      localStorage.removeItem('ncm-col-' + col);
    }

    function restoreColWidths() {
      ['method', 'path', 'status', 'crypto', 'duration', 'time'].forEach(col => {
        const saved = localStorage.getItem('ncm-col-' + col);
        if (!saved) return;
        let w = parseInt(saved, 10);
        if (!isNaN(w) && w >= 28) {
          w = Math.min(w, 600); // 保护上限，避免旧值恢复后溢出面板
          const root = document.documentElement;
          if (col === 'path') root.style.setProperty('--col-path', 'minmax(' + w + 'px, 1fr)');
          else root.style.setProperty('--col-' + col, w + 'px');
        }
      });
    }

    // ======================== SSE & 初始化 ========================
    function setupSSE() {
      eventSource = new EventSource('/api/events');
      eventSource.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          setConnUI(true);
          const prevLen = capturedData.length;
          capturedData = data;
          renderCaptureList();

          if (autoScroll && data.length > prevLen && data.length > 0) {
            selectCapture(data.length - 1, true);
          } else if (selectedIndex === -1 && data.length > 0) {
            selectCapture(0);
          } else if (selectedIndex >= data.length) {
            selectedIndex = -1;
            renderEmptyDetail();
          } else if (selectedIndex >= 0) {
            const item = capturedData[selectedIndex];
            if (item) renderDetail(item, selectedIndex);
          }
        } catch (e) {
          console.error('SSE parse error:', e);
        }
      };
      eventSource.onerror = function() {
        setConnUI(false);
      };
    }

    function fetchSettings() {
      fetch('/api/settings')
        .then(r => r.json())
        .then(data => {
          const btn = document.getElementById('full-capture-btn');
          if (btn && data.fullCapture) {
            btn.classList.add('active', 'btn-default');
            btn.textContent = '完整抓包 ON';
          }
        })
        .catch(() => {});
    }

    function fetchVersion() {
      fetch('/api/version')
        .then(r => r.json())
        .then(d => {
          document.getElementById('version-badge').textContent = 'v' + (d.version || '0.1.0');
        })
        .catch(() => {
          document.getElementById('version-badge').textContent = 'v0.1.0';
        });
    }

    function registerSW() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.log('ServiceWorker registration failed:', err);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      fetchVersion();
      fetchStats();
      fetchSettings();
      setupSSE();
      initResize();
      initColumnResize();
      renderEmptyDetail();
      renderCaptureList();
      registerSW();
      setInterval(fetchStats, 5000);

      document.getElementById('drawer-open-btn').addEventListener('click', () => toggleDrawer(true));
      document.getElementById('drawer-close-btn').addEventListener('click', () => toggleDrawer(false));

      // 初始化排序按钮
      setSort('time');
    });
  </script>
</body>
